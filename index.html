<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="てん・あじ・さとしのMリーグ ドラフト成績。チーム合計、選手ポイント、収支と推移。">
  <link rel="icon" href="data:,">
  <title>Mリーグ ドラフト成績</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/lucide.js"></script>
  <script defer src="vendor/chart.umd.js"></script>
  <script defer src="app-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">成績へ</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="#teams" aria-label="Mリーグ ドラフト成績 チーム成績へ"><img src="assets/mleague.svg" alt="M.LEAGUE" width="132" height="35"><span class="brand-divider"></span><span>ドラフト成績<small>てん・あじ・さとし</small></span></a>
      <div class="header-tools"><label class="select-wrap"><span class="sr-only">シーズン</span><select id="season" aria-label="シーズン"></select><i data-lucide="chevron-down"></i></label><a class="icon-button" id="draft-link" href="https://m-league-draft-ten-aji-satoshi.naga-study.workers.dev/" target="_blank" rel="noopener noreferrer" aria-label="ドラフト結果を開く" data-tooltip="ドラフト結果"><i data-lucide="external-link"></i></a></div>
    </div>
  </header>
  <div class="navigation"><nav class="shell tabs" aria-label="成績のページ"><a href="#teams" data-view="teams"><i data-lucide="users"></i>チーム成績</a><a href="#players" data-view="players"><i data-lucide="list-ordered"></i>選手一覧</a><a href="#history" data-view="history"><i data-lucide="chart-no-axes-combined"></i>推移・履歴</a></nav></div>
  <main class="shell" id="main">
    <div class="page-heading"><div><div class="eyebrow" id="season-label">M.LEAGUE / FANTASY DRAFT</div><h1 id="page-title">チーム成績</h1></div><div class="freshness" id="freshness" aria-live="polite"></div></div>
    <div class="context-bar"><div class="segmented" id="stage-tabs" role="group" aria-label="集計範囲"><button type="button" data-stage="total" aria-pressed="true">通算</button><button type="button" data-stage="regular" aria-pressed="false">レギュラー</button><button type="button" data-stage="semi" aria-pressed="false">セミ</button><button type="button" data-stage="final" aria-pressed="false">ファイナル</button></div><span class="scope-note" id="scope-note"></span></div>
    <div id="data-notice" class="notice" role="status" hidden></div>
    <div id="page-content"></div>
    <noscript><p class="notice">成績の表示にはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <footer class="shell footer"><span>非公式ドラフト集計 <span class="footer-dot">·</span> 個人ポイント単純合算</span><div><button id="source-button" class="text-button" type="button"><i data-lucide="database"></i>集計・出典</button><a href="https://github.com/tenten-ensuku/m-league-score" target="_blank" rel="noopener noreferrer">GitHub<i data-lucide="arrow-up-right"></i></a><span class="version">v2.0</span></div></footer>
  <dialog id="player-dialog" aria-labelledby="player-title"><div id="player-content"></div></dialog>
  <dialog id="source-dialog" aria-labelledby="source-title"><div class="dialog-heading"><h2 id="source-title">集計・出典</h2><button type="button" class="icon-button" data-close="source-dialog" aria-label="閉じる" data-tooltip="閉じる"><i data-lucide="x"></i></button></div><div id="source-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
