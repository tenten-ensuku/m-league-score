name: Mリーグ データ自動更新

on:
  schedule:
    # Tue/Wed/Fri/Sat 02:00 JST, with a 06:00 retry for delayed source updates.
    - cron: '0 17,21 * * 1,2,4,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m-league-production-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 収集・履歴保護のテスト
        run: npm test
      - name: 成績取得・照合・生成
        run: node scrape.js
      - name: 変更をコミット
        id: changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seasons app-data.js data.js history.js
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "データ更新: $(TZ=Asia/Tokyo date '+%Y/%m/%d')"
            # A concurrent upstream change must stop this run. Never merge generated files.
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 検証済みサイトをNetlifyへ公開
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
          npx --yes netlify-cli@24.0.1 deploy --prod --dir=dist --no-build
      - name: 結果
        if: always()
        run: |
          echo "## Mリーグ更新" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}. 取得・検証失敗時は本番と既存履歴を維持します。" >> "$GITHUB_STEP_SUMMARY"
